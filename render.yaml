# Render Blueprint — https://render.com/docs/blueprint-spec
# Secrets are never stored here: `sync: false` values are prompted for in the Render
# dashboard when the Blueprint is created; JWT secrets are generated by Render.
# Database: Supabase (external), see ENVIRONMENT.md.

services:
  # ─── API NestJS ────────────────────────────────────────────────
  - type: web
    name: software-house-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt # closest Render region to Supabase eu-west-1
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Free plan has no pre-deploy command: migrations run at startup (idempotent).
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL # Supabase pooler, transaction mode (:6543)
        sync: false
      - key: DIRECT_URL # Supabase pooler, session mode (:5432) — migrations
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN # public URL of the frontend service
        sync: false
      - key: SMTP_HOST # optional: without it, emails are logged instead of sent
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # ─── Site Next.js ──────────────────────────────────────────────
  - type: web
    name: software-house-web
    runtime: node
    rootDir: frontend
    plan: free
    region: frankfurt
    # output: "standalone" → assets must be copied next to the standalone server.
    buildCommand: npm ci --include=dev && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME # standalone server must listen on all interfaces
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL # baked in at build time: https://<api>.onrender.com/api/v1
        sync: false
      - key: NEXT_PUBLIC_SITE_URL # public URL of this service
        sync: false
